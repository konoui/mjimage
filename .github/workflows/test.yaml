name: test
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # ライブラリとブラウザ配布物の両方がビルドできることを確認する
      - run: npm run build
      - run: npm run build:browser
